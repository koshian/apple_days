name: Update products

on:
  push:
  schedule:
    - cron: "17 13-19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update products.json
        run: python3 scripts/update_products.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/products.json data/unmatched-newsroom.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Apple product releases"
            git push
          fi
