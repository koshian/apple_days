<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Apple Days ][</title>
<style>
  :root{
    --paper:#f4f0e6;
    --ink:#1d1d1b;
    --muted:#726f67;
    --line:#cfc8b8;
    --panel:#fffdf7;
    --shadow:#bdb5a5;
    --fresh:#1d7f4e;
    --soon:#a56a00;
    --ripe:#a12b2b;
    --terminal:#172018;
    --terminal-ink:#b7ff96;
  }
  *{box-sizing:border-box}
  html{background:var(--paper);color:var(--ink)}
  body{
    margin:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
    background:
      linear-gradient(rgba(29,29,27,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(29,29,27,.025) 1px,transparent 1px),
      var(--paper);
    background-size:24px 24px;
    min-height:100vh;
  }
  button,input,select{font:inherit}
  a{color:inherit}

  .shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:32px 0 64px}
  .masthead{
    display:grid;
    grid-template-columns:1fr auto;
    gap:22px;
    align-items:end;
    margin-bottom:22px;
  }
  .brand{
    display:flex;
    gap:18px;
    align-items:center;
  }
  .mark{
    display:grid;
    place-items:center;
    width:74px;height:74px;
    border:3px solid var(--ink);
    background:var(--terminal);
    color:var(--terminal-ink);
    box-shadow:5px 5px 0 var(--shadow);
    font-size:34px;
    line-height:1;
    letter-spacing:-.12em;
    padding-right:.12em;
    user-select:none;
  }
  h1{
    margin:0;
    font-size:clamp(30px,5vw,56px);
    line-height:.95;
    letter-spacing:-.075em;
    font-weight:900;
  }
  .tagline{
    margin:.7rem 0 0;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.05em;
  }
  .statusbox{
    border:2px solid var(--ink);
    background:var(--panel);
    box-shadow:4px 4px 0 var(--shadow);
    padding:10px 12px;
    min-width:218px;
    font-size:12px;
    line-height:1.55;
  }
  .statusbox b{display:block;font-size:13px}
  .rainbow{
    height:7px;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    border:2px solid var(--ink);
    border-bottom:0;
  }
  .rainbow i:nth-child(1){background:#6b4db0}
  .rainbow i:nth-child(2){background:#4c79b9}
  .rainbow i:nth-child(3){background:#2f9a68}
  .rainbow i:nth-child(4){background:#d0a420}
  .rainbow i:nth-child(5){background:#df7631}
  .rainbow i:nth-child(6){background:#bb4650}

  .intro{
    border:2px solid var(--ink);
    background:var(--panel);
    box-shadow:5px 5px 0 var(--shadow);
    padding:16px 18px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    gap:18px;
    align-items:center;
  }
  .intro strong{font-size:14px}
  .intro p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
  .blink{
    display:inline-block;width:9px;height:14px;background:var(--ink);vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .toolbar{
    display:grid;
    grid-template-columns:minmax(180px,1.5fr) repeat(2,minmax(150px,.7fr));
    gap:10px;
    margin-bottom:18px;
  }
  .control{
    width:100%;
    border:2px solid var(--ink);
    background:var(--panel);
    min-height:42px;
    padding:0 12px;
    color:var(--ink);
    outline:none;
  }
  .control:focus{box-shadow:0 0 0 3px #0002}
  select.control{cursor:pointer}

  .summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .summary .cell{
    border:2px solid var(--ink);
    background:var(--panel);
    min-height:78px;
    padding:11px 13px;
    box-shadow:3px 3px 0 var(--shadow);
  }
  .summary small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
  .summary b{display:block;margin-top:6px;font-size:25px;letter-spacing:-.06em}

  .catalog{display:block}
  .product-section{margin:26px 0 34px}
  .section-heading{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin:0 0 12px;
    padding-bottom:7px;
    border-bottom:3px double var(--ink);
  }
  .section-heading h2{
    margin:0;
    font-size:23px;
    letter-spacing:-.055em;
  }
  .section-heading small{
    color:var(--muted);
    font-size:10px;
    letter-spacing:.08em;
  }
  .section-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:14px;
  }
  .card{
    position:relative;
    border:2px solid var(--ink);
    background:var(--panel);
    box-shadow:4px 4px 0 var(--shadow);
    min-height:280px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;inset:0 auto 0 0;width:6px;background:var(--fresh);
  }
  .card.soon::before{background:var(--soon)}
  .card.ripe::before{background:var(--ripe)}
  .card.dead::before{background:#8b8b86}
  .card-head{
    padding:15px 15px 9px 22px;
    display:flex;
    gap:10px;
    align-items:start;
    justify-content:space-between;
  }
  .product-name{
    margin:0;
    font-size:17px;
    line-height:1.2;
    letter-spacing:-.04em;
  }
  .badge{
    display:block;
    margin:2px 15px 4px 22px;
    border-left:4px solid currentColor;
    padding:5px 8px;
    font-size:11px;
    line-height:1.45;
    font-weight:700;
    color:var(--fresh);
    background:rgba(29,127,78,.07);
  }
  .soon .badge{color:var(--soon);background:rgba(165,106,0,.07)}
  .ripe .badge{color:var(--ripe);background:rgba(161,43,43,.07)}
  .dead .badge{color:#777;background:#7771}
  .days{
    padding:2px 15px 0 22px;
    display:flex;
    align-items:baseline;
    gap:7px;
  }
  .days strong{
    font-size:clamp(38px,6vw,62px);
    line-height:.95;
    letter-spacing:-.08em;
  }
  .days span{color:var(--muted);font-size:11px}

  .cycle{
    padding:10px 15px 0 22px;
    font-size:11px;
    color:var(--muted);
  }
  .meter{
    margin:8px 15px 0 22px;
    height:16px;
    border:2px solid var(--ink);
    background:repeating-linear-gradient(90deg,#0000 0 9%,#0001 9% 10%);
    position:relative;
  }
  .meter > i{
    display:block;height:100%;width:var(--pct);
    max-width:100%;
    background:var(--fresh);
  }
  .soon .meter > i{background:var(--soon)}
  .ripe .meter > i{background:var(--ripe)}
  .dead .meter > i{background:#8b8b86}
  .meter-label{
    padding:5px 15px 0 22px;
    font-size:10px;color:var(--muted);
  }

  .release{
    margin-top:auto;
    border-top:1px dashed var(--line);
    padding:11px 15px 13px 22px;
    font-size:10px;
    line-height:1.5;
  }
  .release b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .release a{text-decoration-style:dotted;text-underline-offset:2px}
  .release time{color:var(--muted)}

  .empty,.error{
    grid-column:1/-1;
    border:2px solid var(--ink);
    background:var(--panel);
    padding:24px;
    box-shadow:4px 4px 0 var(--shadow);
    line-height:1.7;
  }
  .error{border-color:var(--ripe)}
  .error code{word-break:break-all}

  footer{
    margin-top:28px;
    border-top:2px solid var(--ink);
    padding-top:12px;
    display:flex;
    justify-content:space-between;
    gap:14px;
    color:var(--muted);
    font-size:10px;
    line-height:1.5;
  }

  @media (max-width:860px){
    .masthead{grid-template-columns:1fr}
    .statusbox{width:100%}
    .section-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .summary{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:560px){
    .shell{width:min(100% - 18px,1180px);padding-top:18px}
    .brand{align-items:flex-start}
    .mark{width:58px;height:58px;font-size:28px}
    .toolbar{grid-template-columns:1fr}
    .section-grid{grid-template-columns:1fr}
    .intro{align-items:flex-start;flex-direction:column}
    footer{flex-direction:column}
  }
  @media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div class="brand">
      <div class="mark" aria-hidden="true">][</div>
      <div>
        <h1>Apple Days ][</h1>
        <p class="tagline">How many sleeps until the next shiny rectangle?</p>
      </div>
    </div>
    <div>
      <div class="rainbow" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="statusbox">
        <b id="clock">SYSTEM READY</b>
        <span id="dataStatus">Loading product history…</span>
      </div>
    </div>
  </header>

  <section class="intro">
    <div>
      <strong>&gt; PRODUCT CYCLE MONITOR <span class="blink"></span></strong>
      <p>Apple Days さんが更新されなくなって寂しいので自動更新の実験がてら置いておきます……</p>
    </div>
    <div style="font-size:11px;color:var(--muted);white-space:nowrap">
      DATA: <span id="updatedAt">---</span>
    </div>
  </section>

  <div class="toolbar">
    <input id="search" class="control" type="search" placeholder="製品名を検索 /">
  </div>

  <main id="grid" class="catalog" aria-live="polite"></main>

  <footer>
    <span>Apple Days ][ — an unofficial homage, not affiliated with Apple Inc.</span>
    <span>release history → <a id="dataLink" href="#" target="_blank" rel="noreferrer">products.json</a></span>
  </footer>
</div>

<script>
(() => {
  "use strict";

  const params = new URLSearchParams(location.search);
  const JSON_URL = "./data/products.json";

  const $ = (s) => document.querySelector(s);
  const els = {
    grid: $("#grid"),
    search: $("#search"),
    updatedAt: $("#updatedAt"),
    dataStatus: $("#dataStatus"),
    dataLink: $("#dataLink"),
    clock: $("#clock")
  };

  let products = [];

  const MS_DAY = 86400000;

  function parseISO(s) {
    // 日付だけをローカルTZで作るとDST等で日数がずれるのでUTC固定。
    const [y,m,d] = s.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }

  function todayUTC() {
    const n = new Date();
    return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()));
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / MS_DAY);
  }

  function formatDate(iso) {
    const d = parseISO(iso);
    return new Intl.DateTimeFormat("ja-JP", {
      year:"numeric", month:"short", day:"numeric", timeZone:"UTC"
    }).format(d);
  }

  function average(nums) {
    if (!nums.length) return null;
    return Math.round(nums.reduce((a,b) => a + b, 0) / nums.length);
  }

  function median(nums) {
    if (!nums.length) return null;
    const a = [...nums].sort((x,y) => x-y);
    const m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : Math.round((a[m-1] + a[m]) / 2);
  }

  function analyze(product) {
    const releases = [...(product.releases || [])]
      .filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date || ""))
      .sort((a,b) => b.date.localeCompare(a.date));

    if (!releases.length) return null;

    const datesAsc = releases.map(r => parseISO(r.date)).sort((a,b) => a-b);
    const intervals = [];
    for (let i=1; i<datesAsc.length; i++) {
      const n = daysBetween(datesAsc[i-1], datesAsc[i]);
      if (n > 0) intervals.push(n);
    }

    const latest = releases[0];
    const days = Math.max(0, daysBetween(parseISO(latest.date), todayUTC()));
    const avg = average(intervals);
    const med = median(intervals);
    const ratio = avg ? days / avg : null;

    let mood = "fresh";
    let label = "発売されたばかりです。買うんだ！";
    if (product.status === "discontinued") {
      mood = "dead";
      label = "販売終了。歴史資料です。";
    } else if (ratio === null) {
      mood = "fresh";
      label = "周期データがまだ足りません。";
    } else if (ratio >= .75) {
      mood = "ripe";
      label = "近日中に新型が出る可能性があります。買う決断の前に情報収集を！";
    } else if (ratio >= .50) {
      mood = "soon";
      label = "平均周期の半分を過ぎました。";
    } else if (ratio >= .25) {
      mood = "fresh";
      label = "買ってしまえ！";
    }

    return {
      ...product,
      releases,
      latest,
      days,
      avg,
      med,
      ratio,
      mood,
      label,
      releaseCount: releases.length
    };
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[c]));
  }

  function cardHTML(p) {
    const pct = p.ratio === null ? 0 : Math.min(100, Math.round(p.ratio * 100));
    const ratioText = p.ratio === null
      ? "周期データ不足"
      : `${Math.round(p.ratio * 100)}% of average cycle`;

    const avgText = p.avg ? `${p.avg}日` : "---";
    const medText = p.med ? `${p.med}日` : "---";
    const source = p.latest.source
      ? `<a href="${escapeHTML(p.latest.source)}" target="_blank" rel="noreferrer">${escapeHTML(p.latest.label || "source")}</a>`
      : escapeHTML(p.latest.label || "release");

    return `
      <article class="card ${p.mood}">
        <div class="card-head">
          <h3 class="product-name">${escapeHTML(p.name)}</h3>
        </div>
        <div class="badge">${escapeHTML(p.label)}</div>

        <div class="days">
          <strong>${p.days.toLocaleString("ja-JP")}</strong>
          <span>DAYS<br>SINCE</span>
        </div>

        <div class="cycle">AVG ${avgText} / MEDIAN ${medText}</div>
        <div class="meter" title="${escapeHTML(ratioText)}">
          <i style="--pct:${pct}%"></i>
        </div>
        <div class="meter-label">${escapeHTML(ratioText)} · ${p.releaseCount} releases</div>

        <div class="release">
          <time datetime="${escapeHTML(p.latest.date)}">LAST BOOT: ${escapeHTML(formatDate(p.latest.date))}</time>
          <b title="${escapeHTML(p.latest.label || "")}">${source}</b>
        </div>
      </article>
    `;
  }

  const CATEGORY_ORDER = [
    { id:"iphone",  title:"iPhone",  note:"PHONE", ids:["iphone","iphone-pro","iphone-entry"] },
    { id:"ipad",    title:"iPad",    note:"TABLET", ids:["ipad","ipad-air","ipad-pro","ipad-mini"] },
    { id:"macbook", title:"MacBook", note:"PORTABLE MAC", ids:["macbook-air","macbook-pro-14","macbook-pro-16","macbook-neo","macbook","macbook-pro-13"] },
    { id:"mac",     title:"Mac",     note:"DESKTOP MAC", ids:["imac","mac-mini","mac-studio","mac-pro"] },
    { id:"other",   title:"その他",   note:"OTHER APPLE THINGS", ids:["apple-tv","homepod","airpods","airpods-pro","ipod-touch"] }
  ];

  function categoryOf(product) {
    return CATEGORY_ORDER.find(c => c.ids.includes(product.id)) || CATEGORY_ORDER[CATEGORY_ORDER.length - 1];
  }

  function currentView() {
    const q = els.search.value.trim().toLowerCase();

    let list = products.filter(Boolean);
    if (q) list = list.filter(p =>
      `${p.name} ${p.id} ${p.latest?.label || ""}`.toLowerCase().includes(q)
    );

    return list;
  }

  function render() {
    const list = currentView();

    if (!list.length) {
      els.grid.innerHTML = `<div class="empty">&gt; NO MATCHING PRODUCTS_<br>検索条件を変えてください。</div>`;
    } else {
      els.grid.innerHTML = CATEGORY_ORDER.map(category => {
        const items = list.filter(p => categoryOf(p).id === category.id);
        if (!items.length) return "";
        return `
          <section class="product-section" id="section-${category.id}">
            <header class="section-heading">
              <h2>${escapeHTML(category.title)}</h2>
              <small>${escapeHTML(category.note)} / ${items.length}</small>
            </header>
            <div class="section-grid">${items.map(cardHTML).join("")}</div>
          </section>`;
      }).join("");
    }
  }

  function showError(err) {
    els.dataStatus.textContent = "DATA LINK ERROR";
    els.grid.innerHTML = `
      <div class="error">
        <b>&gt; COULD NOT LOAD PRODUCTS.JSON</b><br><br>
        ${escapeHTML(err.message || err)}<br><br>
      </div>`;
  }

  async function load() {
    els.dataLink.href = JSON_URL;
    els.dataStatus.textContent = `READING ${JSON_URL.replace(/^https?:\/\//,"")}`;

    const res = await fetch(JSON_URL, {cache:"no-store"});
    if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);

    const data = await res.json();
    if (!data || !Array.isArray(data.products)) {
      throw new Error("products.json の形式が想定と違います（products 配列がありません）");
    }

    products = data.products.map(analyze).filter(Boolean);
    els.updatedAt.textContent = data.updatedAt || "UNKNOWN";
    els.dataStatus.textContent = `${products.length} PRODUCT FAMILIES ONLINE`;
    render();
  }

  function tickClock() {
    const now = new Date();
    els.clock.textContent = new Intl.DateTimeFormat("ja-JP", {
      year:"numeric",month:"2-digit",day:"2-digit",
      hour:"2-digit",minute:"2-digit",second:"2-digit",
      hour12:false
    }).format(now);
  }

  els.search.addEventListener("input", render);

  tickClock();
  setInterval(tickClock, 1000);
  load().catch(showError);
})();
</script>
</body>
</html>
