<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazon iPhone 17 Pro image sample</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f5f5f7;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { width: min(520px, calc(100% - 32px)); }
  .note { color: #6e6e73; font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
  .amazon-card {
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 20px;
    align-items: center;
    padding: 20px;
    border: 1px solid #d2d2d7;
    border-radius: 16px;
    background: #fff;
  }
  .amazon-card img {
    width: 180px;
    height: 180px;
    object-fit: contain;
    display: block;
  }
  .amazon-card h1 { margin: 0 0 8px; font-size: 22px; }
  .amazon-card p { margin: 0 0 14px; color: #6e6e73; font-size: 13px; line-height: 1.5; }
  .amazon-link {
    display: inline-block;
    padding: 9px 14px;
    border-radius: 999px;
    background: #ffd814;
    color: #111;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
  }
  .meta { margin: 14px 2px 0; color: #6e6e73; font-size: 11px; line-height: 1.6; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  @media (max-width: 480px) {
    .amazon-card { grid-template-columns: 1fr; text-align: center; }
    .amazon-card img { margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="note">
    Amazon.co.jp に実在する iPhone 17 Pro の商品を使った表示サンプルです。
    画像ファイルはこのリポジトリには保存せず、Amazon の画像CDNから直接表示します。
  </p>

  <article class="amazon-card">
    <a href="https://www.amazon.co.jp/dp/B0FQFLM679" target="_blank" rel="sponsored noreferrer">
      <img
        src="https://m.media-amazon.com/images/I/51PAvGLRSwL._AC_SL1000_.jpg"
        alt="Apple iPhone 17 Pro ディープブルー"
        referrerpolicy="no-referrer">
    </a>
    <div>
      <h1>iPhone 17 Pro</h1>
      <p>256GB / ディープブルー。ASIN: <code>B0FQFLM679</code></p>
      <a class="amazon-link" href="https://www.amazon.co.jp/dp/B0FQFLM679" target="_blank" rel="sponsored noreferrer">Amazonで見る</a>
    </div>
  </article>

  <p class="meta">
    Image host: <code>m.media-amazon.com</code><br>
    実運用でアソシエイトリンクにする場合は、商品URLを自分のAssociate Tag付きURLまたはCreators APIのDetailPageURLに置き換えます。
  </p>
</div>
</body>
</html>
