<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amazon product link sample</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f5f5f7;
    color: #1d1d1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { width: min(520px, calc(100% - 32px)); }
  .note { color: #6e6e73; font-size: 13px; line-height: 1.6; margin: 0 0 16px; }
  .amazon-card {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 20px;
    align-items: center;
    padding: 20px;
    border: 1px solid #d2d2d7;
    border-radius: 16px;
    background: #fff;
  }
  .amazon-card img {
    width: 150px;
    height: 120px;
    object-fit: contain;
    display: block;
  }
  .amazon-card h1 { margin: 0 0 8px; font-size: 22px; }
  .amazon-card p { margin: 0 0 14px; color: #6e6e73; font-size: 13px; line-height: 1.5; }
  .amazon-link {
    display: inline-block;
    padding: 9px 14px;
    border-radius: 999px;
    background: #ffd814;
    color: #111;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
  }
  .disclosure { margin: 14px 2px 0; color: #6e6e73; font-size: 11px; line-height: 1.5; }
  @media (max-width: 480px) {
    .amazon-card { grid-template-columns: 1fr; text-align: center; }
    .amazon-card img { margin: 0 auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="note">
    Apple Days ][ 本体には一切手を入れない、Amazon商品画像＋アフィリエイトリンクの表示サンプルです。
    実運用では imageUrl と detailPageUrl を Creators API の返値に差し替えます。
  </p>

  <article class="amazon-card" id="amazonCard">
    <a id="imageLink" href="#" target="_blank" rel="sponsored noreferrer">
      <img id="productImage" alt="Mac miniの商品画像">
    </a>
    <div>
      <h1 id="productTitle">Mac mini</h1>
      <p>商品画像はAmazonが提供するURLを直接表示し、自前サーバーには保存しない想定です。</p>
      <a id="productLink" class="amazon-link" href="#" target="_blank" rel="sponsored noreferrer">Amazonで見る</a>
    </div>
  </article>

  <p class="disclosure">Amazonのアソシエイトとして、適格販売により収入を得る場合があります。</p>
</div>

<script>
(() => {
  // Creators API の返値をこの形に正規化すれば表示できます。
  // imageUrl は Amazon が提供する画像URL、detailPageUrl はアフィリエイト付き商品URLを想定。
  const amazonItem = {
    title: "Mac mini",
    imageUrl: null,
    detailPageUrl: null
  };

  // API未接続でもレイアウト確認できるよう、サンプル画像だけ data URI で表示。
  const placeholderSvg = `
    <svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480">
      <rect width="600" height="480" rx="36" fill="#f5f5f7"/>
      <rect x="135" y="125" width="330" height="230" rx="32" fill="#d8d8dc" stroke="#b8b8bd" stroke-width="4"/>
      <circle cx="425" cy="315" r="8" fill="#8e8e93"/>
      <text x="300" y="405" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#6e6e73">Amazon image via Creators API</text>
    </svg>`;

  const image = document.querySelector("#productImage");
  const title = document.querySelector("#productTitle");
  const imageLink = document.querySelector("#imageLink");
  const productLink = document.querySelector("#productLink");

  title.textContent = amazonItem.title;
  image.src = amazonItem.imageUrl || `data:image/svg+xml;charset=utf-8,${encodeURIComponent(placeholderSvg)}`;

  const href = amazonItem.detailPageUrl || "https://www.amazon.co.jp/";
  imageLink.href = href;
  productLink.href = href;
})();
</script>
</body>
</html>
